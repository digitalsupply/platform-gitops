apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app.kubernetes.io/part-of: platform
  name: platform-ceph-csi
  namespace: argocd
spec:
  destination:
    namespace: ceph-csi-rbd
    server: https://kubernetes.default.svc
  project: default
  # After the migration to Ceph-CSI-Operator this Application keeps only the
  # resources that are not owned by the operator:
  #   - StorageClass ceph-rbd-sc
  #   - SealedSecret csi-rbd-secret
  # The legacy Helm release has been uninstalled; the driver itself is managed
  # by platform-ceph-csi-drivers through the ceph-csi-operator.
  source:
    path: platform/ceph-csi/resources
    repoURL: http://192.168.67.201/digitalsupply/platform-gitops.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

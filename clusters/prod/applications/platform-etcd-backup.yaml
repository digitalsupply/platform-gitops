apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-etcd-backup
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: default
  source:
    repoURL: http://192.168.67.201/digitalsupply/platform-gitops.git
    targetRevision: main
    path: platform/backup/etcd
  destination:
    server: https://kubernetes.default.svc
    namespace: etcd-backup
  syncPolicy:
    automated:
      # Never prune snapshots/CronJob automatically; backups are data.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

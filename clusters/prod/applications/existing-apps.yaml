---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-config
  namespace: argocd
spec:
  destination:
    namespace: tekton-pipelines
    server: https://kubernetes.default.svc
  project: default
  source:
    path: config
    repoURL: http://192.168.67.201/digitalsupply/tekton-platform-gitops.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-operator
  namespace: argocd
spec:
  destination:
    namespace: tekton-operator
    server: https://kubernetes.default.svc
  ignoreDifferences:
  - group: apiextensions.k8s.io
    jqPathExpressions:
    - .spec.conversion
    jsonPointers:
    - /spec/conversion
    - /spec/preserveUnknownFields
    kind: CustomResourceDefinition
  project: default
  source:
    path: operator
    repoURL: http://192.168.67.201/digitalsupply/tekton-platform-gitops.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true

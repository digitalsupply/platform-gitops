apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-monitoring-crds
  namespace: argocd
  annotations:
    # 先于监控栈（sync-wave 10）应用 CRD
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: http://192.168.67.201/digitalsupply/platform-gitops.git
    targetRevision: main
    path: platform/monitoring/crds
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      # 不允许 ArgoCD 删除 CRD
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      # CRD 之前由手工 server-side apply 过，允许接管字段
      - Force=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

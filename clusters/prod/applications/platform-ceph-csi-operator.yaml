apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app.kubernetes.io/part-of: platform
  name: platform-ceph-csi-operator
  namespace: argocd
spec:
  destination:
    namespace: ceph-csi-operator-system
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://ceph.github.io/ceph-csi-operator
    chart: ceph-csi-operator
    targetRevision: 1.1.0
    helm:
      releaseName: ceph-csi-operator
      valuesObject:
        controllerManager:
          manager:
            env:
              # The operator must watch the namespace where Driver/ClientProfile
              # CRs live (ceph-csi-rbd). An empty value makes it watch only its
              # own namespace and the Driver is never reconciled.
              watchNamespace: ceph-csi-rbd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

# MetalLB address pools and L2 advertisements (current production config).
# NOTE: speaker is disabled (see kustomize patch); L2Advertisement objects are
# kept so that reverting the patch restores the previous behaviour.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lb-pool-eth1
  namespace: metallb-system
spec:
  addresses:
  - 172.16.1.220-172.16.1.250
  autoAssign: true
  avoidBuggyIPs: false
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lb-pool-tailscale
  namespace: metallb-system
spec:
  addresses:
  - 10.0.0.252-10.0.0.253
  autoAssign: true
  avoidBuggyIPs: false
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2adv-eth1
  namespace: metallb-system
spec:
  interfaces:
  - eth1
  ipAddressPools:
  - lb-pool-eth1
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2adv-tailscale
  namespace: metallb-system
spec:
  interfaces:
  - eth0
  - eth1
  ipAddressPools:
  - lb-pool-tailscale

apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  labels:
    app.kubernetes.io/part-of: china-study-free-cicd
  name: china-study-free-cicd
  namespace: cicd
spec:
  description: GitLab push -> build/push Harbor -> update GitOps -> Argo CD.
  params:
  - default: http://192.168.67.201/digitalsupply/ChinaStudyFree.git
    name: git-url
    type: string
  - name: git-revision
    type: string
  - default: ''
    name: git-before
    type: string
  - default: 192.168.67.202:8443/china-study-free/web
    name: image-repository
    type: string
  - name: image-tag
    type: string
  - default: http://192.168.67.201/digitalsupply/china-study-free-gitops.git
    name: gitops-url
    type: string
  - default: 192.168.67.202:8443/deeptutor/node:22-slim
    name: node-image
    type: string
  - default: https://registry.npmmirror.com
    name: npm-registry
    type: string
  tasks:
  - name: clone
    params:
    - name: url
      value: $(params.git-url)
    - name: revision
      value: $(params.git-revision)
    - name: depth
      value: '1'
    taskRef:
      kind: Task
      name: git-clone
    workspaces:
    - name: output
      workspace: shared-workspace
  - name: check-changes
    params:
    - name: url
      value: $(params.git-url)
    - name: before
      value: $(params.git-before)
    - name: after
      value: $(params.git-revision)
    runAfter:
    - clone
    taskRef:
      kind: Task
      name: china-study-free-check-changes
    workspaces:
    - name: source
      workspace: shared-workspace
  - name: build-push
    params:
    - name: image
      value: $(params.image-repository):$(params.image-tag)
    - name: context
      value: source
    - name: dockerfile
      value: docker/Dockerfile
    - name: node-image
      value: $(params.node-image)
    - name: npm-registry
      value: $(params.npm-registry)
    runAfter:
    - check-changes
    taskRef:
      kind: Task
      name: china-study-free-build-push
    when:
    - input: $(tasks.check-changes.results.need-build)
      operator: in
      values:
      - 'true'
    workspaces:
    - name: source
      workspace: shared-workspace
  - name: update-gitops
    params:
    - name: image-tag
      value: $(params.image-tag)
    - name: gitops-url
      value: $(params.gitops-url)
    runAfter:
    - build-push
    taskRef:
      kind: Task
      name: china-study-free-update-gitops
    when:
    - input: $(tasks.check-changes.results.need-build)
      operator: in
      values:
      - 'true'
    workspaces:
    - name: source
      workspace: shared-workspace
  workspaces:
  - name: shared-workspace
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  labels:
    app.kubernetes.io/part-of: compassio-cicd
  name: compassio-cicd
  namespace: cicd
spec:
  description: 'Compassio CI/CD: clone from GitLab, build backend+frontend images,
    push to Harbor, promote tags in GitOps repo (Argo CD auto-syncs).'
  params:
  - default: http://192.168.67.201/digitalsupply/compassio.git
    name: git-url
    type: string
  - default: main
    name: git-revision
    type: string
  - default: ''
    name: git-before
    type: string
  - default: 192.168.67.202:8443/compassio/backend
    name: image-repository-backend
    type: string
  - default: 192.168.67.202:8443/compassio/frontend
    name: image-repository-frontend
    type: string
  - description: Tag to build and promote (commit SHA or uid)
    name: image-tag
    type: string
  tasks:
  - name: clone
    params:
    - name: url
      value: $(params.git-url)
    - name: revision
      value: $(params.git-revision)
    taskRef:
      kind: Task
      name: git-clone
    workspaces:
    - name: output
      workspace: shared-workspace
  - description: 只改文档/CI 清单时不构建,避免无意义的镜像与滚动重启
    name: check-changes
    params:
    - name: url
      value: $(params.git-url)
    - name: before
      value: $(params.git-before)
    - name: after
      value: $(params.git-revision)
    - name: subdirectory
      value: source
    - name: build-patterns
      value: backend/* frontend/*
    runAfter:
    - clone
    taskRef:
      kind: Task
      name: compassio-check-changes
    workspaces:
    - name: source
      workspace: shared-workspace
  - name: build-push-backend
    params:
    - name: image
      value: $(params.image-repository-backend):$(params.image-tag)
    - name: context
      value: source/backend
    - name: dockerfile
      value: Dockerfile
    runAfter:
    - clone
    taskRef:
      kind: Task
      name: compassio-build-push
    when:
    - input: $(tasks.check-changes.results.need-build)
      operator: in
      values:
      - 'true'
    workspaces:
    - name: source
      workspace: shared-workspace
  - name: build-push-frontend
    params:
    - name: image
      value: $(params.image-repository-frontend):$(params.image-tag)
    - name: context
      value: source/frontend
    - name: dockerfile
      value: Dockerfile
    runAfter:
    - clone
    taskRef:
      kind: Task
      name: compassio-build-push
    when:
    - input: $(tasks.check-changes.results.need-build)
      operator: in
      values:
      - 'true'
    workspaces:
    - name: source
      workspace: shared-workspace
  - name: promote-gitops
    params:
    - name: image-tag
      value: $(params.image-tag)
    runAfter:
    - build-push-backend
    - build-push-frontend
    taskRef:
      kind: Task
      name: compassio-update-gitops
    when:
    - input: $(tasks.check-changes.results.need-build)
      operator: in
      values:
      - 'true'
    workspaces:
    - name: source
      workspace: shared-workspace
  workspaces:
  - name: shared-workspace
---

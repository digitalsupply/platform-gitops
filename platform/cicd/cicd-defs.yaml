apiVersion: tekton.dev/v1
kind: Task
metadata:
  labels:
    app.kubernetes.io/part-of: deeptutor-cicd
  name: deeptutor-build-push
  namespace: cicd
spec:
  description: Build the DeepTutor all-in-one image with BuildKit and push to Harbor
    project deeptutor
  params:
  - description: Fully-qualified destination image (registry/project/name:tag)
    name: image
    type: string
  - default: ''
    description: Sub-path of the workspace holding the build context
    name: context
    type: string
  - default: Dockerfile
    name: dockerfile
    type: string
  steps:
  - computeResources: {}
    env:
    - name: DOCKER_CONFIG
      value: /home/user/.docker
    - name: BUILDKIT_HOST
      value: tcp://buildkitd.cicd.svc.cluster.local:1234
    image: 192.168.67.202:8443/compassio/buildkit:v0.20.2-rootless
    name: build
    script: "#!/bin/sh\nset -eu\n# buildctl 客户端会做 registry token 交换;客户端镜像的 CA 库没有\
      \ Harbor\n# 自签 CA,必须把 harbor-ca 合并进信任库,否则报 x509 unknown authority。\ncat /etc/ssl/certs/ca-certificates.crt\
      \ /etc/harbor-ca/ca.crt > /tmp/ca-bundle.crt\nexport SSL_CERT_FILE=/tmp/ca-bundle.crt\n\
      # 国内工具链镜像:PyPI 走清华、npm 走 npmmirror、Debian 走阿里云。\n# Dockerfile 的 ARG 默认值仍是官方源,本地构建不受影响。\n\
      buildctl build \\\n  --frontend dockerfile.v0 \\\n  --local \"context=$(pwd)\"\
      \ \\\n  --local \"dockerfile=$(pwd)\" \\\n  --opt \"filename=$(params.dockerfile)\"\
      \ \\\n  --opt \"target=production\" \\\n  --opt build-arg:PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple\
      \ \\\n  --opt build-arg:NPM_REGISTRY=https://registry.npmmirror.com \\\n  --opt\
      \ build-arg:APT_MIRROR=mirrors.aliyun.com \\\n  --opt build-arg:NODE_IMAGE=192.168.67.202:8443/deeptutor/node:22-slim\
      \ \\\n  --opt build-arg:PYTHON_IMAGE=192.168.67.202:8443/deeptutor/python:3.11-slim\
      \ \\\n  --output \"type=image,name=$(params.image),push=true\" \\\n  --export-cache\
      \ type=inline\necho \"Pushed image: $(params.image)\"\n"
    volumeMounts:
    - mountPath: /home/user/.docker
      name: docker-config
    - mountPath: /etc/harbor-ca
      name: harbor-ca
      readOnly: true
    workingDir: $(workspaces.source.path)/$(params.context)
  volumes:
  - name: docker-config
    secret:
      items:
      - key: .dockerconfigjson
        path: config.json
      secretName: harbor-auth
  - configMap:
      name: harbor-ca
    name: harbor-ca
  workspaces:
  - name: source
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  labels:
    app.kubernetes.io/part-of: deeptutor-cicd
  name: deeptutor-check-changes
  namespace: cicd
spec:
  description: Decide whether a push needs an image build. Docs-only pushes set results.need-build=false
    so build/promote can be skipped with `when`.
  params:
  - name: url
    type: string
  - description: Previous tip SHA from the webhook (body.before).
    name: before
    type: string
  - description: Pushed commit SHA (body.after), already cloned into the workspace.
    name: after
    type: string
  - default: source
    name: subdirectory
    type: string
  - default: '*.md docs/* docs-for-user/* openwiki/*'
    name: docs-patterns
    type: string
  results:
  - description: '''true'' 构建并 promote,''false'' 本次只改文档。'
    name: need-build
    type: string
  - description: 人类可读的判定原因。
    name: reason
    type: string
  - description: 本次改动的文件(截断到 1500 字符)。
    name: changed-files
    type: string
  steps:
  - computeResources: {}
    env:
    - name: GIT_USERNAME
      valueFrom:
        secretKeyRef:
          key: username
          name: gitlab-auth
    - name: GIT_PASSWORD
      valueFrom:
        secretKeyRef:
          key: password
          name: gitlab-auth
    - name: GIT_URL
      value: $(params.url)
    - name: BEFORE
      value: $(params.before)
    - name: AFTER
      value: $(params.after)
    - name: SUBDIR
      value: $(params.subdirectory)
    - name: DOCS_PATTERNS
      value: $(params.docs-patterns)
    image: alpine/git:v2.45.2
    name: check
    script: "#!/bin/sh\nset -eu\n\nNEED=\"$(results.need-build.path)\"\nREASON=\"\
      $(results.reason.path)\"\nFILES=\"$(results.changed-files.path)\"\n# 结果体有大小上限,这里主动截断,避免大改动把\
      \ result 撑爆\nMAX_FILES_CHARS=300\n\nlog() { echo \"[check-changes] $*\"; }\n\
      \nfinish() {\n  # $1 = true|false, $2 = reason\n  printf '%s' \"$1\" > \"$NEED\"\
      \n  # Tekton stores results in the pod termination message (4KB total).\n  #\
      \ A 1800-file merge would otherwise fail the TaskRun before build.\n  printf\
      \ '%s' \"$2\" | cut -c1-300 > \"$REASON\"\n  log \"$1: $2\"\n  exit 0\n}\n\n\
      build() { finish \"true\" \"$1\"; }\n\n[ -n \"$AFTER\" ] || build \"webhook\
      \ 未提供 after SHA\"\n\nSRC=\"$(workspaces.source.path)/$SUBDIR\"\nNO_SCHEME=\"\
      ${GIT_URL#*://}\"\nHOST_PART=\"${NO_SCHEME%%/*}\"\nPATH_PART=\"${NO_SCHEME#*/}\"\
      \nAUTH_URL=\"http://${GIT_USERNAME}:${GIT_PASSWORD}@${HOST_PART}/${PATH_PART}\"\
      \n\n# 流水线里 git-clone 已经把 after 检出到工作区;单独跑 TaskRun 时没有,\n# 这里自己浅克隆一份,方便离线验证判定逻辑。\n\
      if [ ! -d \"$SRC/.git\" ]; then\n  log \"workspace 里没有仓库,浅克隆 $AFTER\"\n  rm\
      \ -rf \"$SRC\"\n  git clone --depth 1 --no-single-branch \"$AUTH_URL\" \"$SRC\"\
      \ >/dev/null 2>&1 \\\n    || { mkdir -p \"$(dirname \"$SRC\")\"; git clone --depth\
      \ 1 \"--filter=blob:none\" \"$AUTH_URL\" \"$SRC\" >/dev/null 2>&1; } \\\n  \
      \  || build \"克隆失败\"\n  git -C \"$SRC\" fetch --depth 1 origin \"$AFTER\" >/dev/null\
      \ 2>&1 || true\n  git -C \"$SRC\" checkout -q \"$AFTER\" 2>/dev/null || true\n\
      fi\n\ncd \"$SRC\"\n\n# 关闭文件名展开:下面的 `for pat in $PATTERNS` 只按空格切分模式。\n# 否则脚本在仓库目录里运行时,`docs/*`\
      \ 会被展开成实际文件,\n# 导致模式失配(通常表现为该跳过却没跳过)。\nset -f\n\n# 新分支/首次推送:before 是全 0,没有可比较的基线\n\
      case \"$BEFORE\" in\n  \"\" | 0000000000000000000000000000000000000000)\n  \
      \  build \"无可比较的 before(新分支或首次推送)\" ;;\nesac\n\nhas_commit() { git cat-file\
      \ -e \"$1^{commit}\" 2>/dev/null; }\n\nif ! has_commit \"$BEFORE\"; then\n \
      \ log \"本地没有 $BEFORE,尝试按 SHA 拉取\"\n  git remote set-url origin \"$AUTH_URL\"\
      \ 2>/dev/null || true\n  git fetch --depth 1 origin \"$BEFORE\" >/dev/null 2>&1\
      \ || true\nfi\nif ! has_commit \"$BEFORE\"; then\n  # 单 commit 推送的常见情况:加深一层就能拿到父提交\n\
      \  log \"按 SHA 拉取失败,尝试 deepen 20\"\n  git fetch --deepen=20 origin >/dev/null\
      \ 2>&1 || true\nfi\nif ! has_commit \"$BEFORE\"; then\n  build \"无法解析 before=$BEFORE(可能是\
      \ force-push/过深历史)\"\nfi\n\nCHANGED_LIST=\"$(git diff --name-only \"$BEFORE\"\
      \ \"$AFTER\" 2>/dev/null || true)\"\nif [ -z \"$CHANGED_LIST\" ]; then\n  build\
      \ \"diff 为空或失败(before=$BEFORE after=$AFTER)\"\nfi\n\n# `cut -c` is per-line;\
      \ a 1800-file diff stays huge. Flatten first.\nprintf '%s' \"$CHANGED_LIST\"\
      \ | tr '\\n' ' ' | cut -c1-\"$MAX_FILES_CHARS\" > \"$FILES\"\n\n# 逐个文件判断:全部命中\
      \ docs-patterns 才跳过\nNON_DOCS=\"\"\nCOUNT=0\nprintf '%s\\n' \"$CHANGED_LIST\"\
      \ > /tmp/changed.txt\nwhile IFS= read -r f; do\n  [ -n \"$f\" ] || continue\n\
      \  COUNT=$((COUNT + 1))\n  HIT=\"false\"\n  for pat in $DOCS_PATTERNS; do\n\
      \    # shellcheck disable=SC2254\n    case \"$f\" in\n      $pat) HIT=\"true\"\
      ; break ;;\n    esac\n  done\n  [ \"$HIT\" = \"true\" ] || NON_DOCS=\"$NON_DOCS\
      \ $f\"\ndone < /tmp/changed.txt\n\nif [ -z \"$NON_DOCS\" ]; then\n  finish \"\
      false\" \"仅文档改动($COUNT 个文件),跳过构建:$(echo \"$CHANGED_LIST\" | tr '\\n' ' ')\"\n\
      fi\n\nbuild \"包含非文档改动($COUNT 个文件):$(echo \"$NON_DOCS\" | cut -c1-180)\"\n"
  workspaces:
  - name: source
---

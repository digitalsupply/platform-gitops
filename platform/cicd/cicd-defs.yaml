apiVersion: tekton.dev/v1
kind: Task
metadata:
  labels:
    app.kubernetes.io/part-of: openwebui-cicd
  name: git-clone
  namespace: cicd
spec:
  description: Clone the application repository from GitLab into the shared workspace
  params:
  - description: Full http(s) URL of the repository
    name: url
    type: string
  - default: main
    name: revision
    type: string
  - default: source
    name: subdirectory
    type: string
  - default: '1'
    name: depth
    type: string
  - default: 'true'
    name: deleteExisting
    type: string
  steps:
  - computeResources: {}
    env:
    - name: GIT_USERNAME
      valueFrom:
        secretKeyRef:
          key: username
          name: gitlab-auth
    - name: GIT_PASSWORD
      valueFrom:
        secretKeyRef:
          key: password
          name: gitlab-auth
    - name: GIT_URL
      value: $(params.url)
    - name: GIT_REVISION
      value: $(params.revision)
    - name: GIT_DEPTH
      value: $(params.depth)
    - name: DELETE_EXISTING
      value: $(params.deleteExisting)
    - name: TARGET
      value: $(workspaces.output.path)/$(params.subdirectory)
    image: alpine/git:v2.45.2
    name: clone
    script: "#!/bin/sh\nset -eu\n\nif [ \"${DELETE_EXISTING}\" = \"true\" ]; then\n\
      \  rm -rf \"$TARGET\"\nfi\n\n# Split \"http://host[:port]/group/project.git\"\
      \ into host and path.\nNO_SCHEME=\"${GIT_URL#*://}\"\nHOST_PART=\"${NO_SCHEME%%/*}\"\
      \nPATH_PART=\"${NO_SCHEME#*/}\"\nAUTH_URL=\"http://${GIT_USERNAME}:${GIT_PASSWORD}@${HOST_PART}/${PATH_PART}\"\
      \n\n# The revision may be a branch/tag OR a raw commit SHA (CI passes\n# CI_COMMIT_SHA).\
      \ `git clone -b <sha>` only accepts branches/tags, so we\n# always shallow-clone\
      \ the default branch (cheap) and then try to fetch\n# the exact commit on top.\n\
      git clone --depth 1 --no-single-branch \"$AUTH_URL\" \"$TARGET\"\ncd \"$TARGET\"\
      \n\ngit fetch --depth 1 origin \"$GIT_REVISION\" 2>/dev/null \\\n  && git checkout\
      \ -q FETCH_HEAD \\\n  || {\n      # Not fetchable by SHA (server-side restriction):\
      \ fall back to\n      # resolving the revision among the refs we already have.\n\
      \      git checkout -q \"$GIT_REVISION\" 2>/dev/null \\\n        || git checkout\
      \ -q \"origin/$GIT_REVISION\"\n    }\n\necho \"Cloned commit: $(git rev-parse\
      \ --short HEAD) (${GIT_REVISION})\"\n"
  workspaces:
  - name: output
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  labels:
    app.kubernetes.io/part-of: openwebui-cicd
  name: update-gitops-tag
  namespace: cicd
spec:
  description: 'Update the image tag in the GitOps repository and push the commit,
    which triggers the Argo CD auto-sync that rolls the new image into the cluster.

    '
  params:
  - description: Tag to write into overlays/prod/kustomization.yaml
    name: image-tag
    type: string
  - default: overlays/prod/kustomization.yaml
    name: kustomize-path
    type: string
  - default: gitops
    name: gitops-subdir
    type: string
  steps:
  - computeResources: {}
    env:
    - name: GIT_USERNAME
      valueFrom:
        secretKeyRef:
          key: username
          name: gitlab-auth
    - name: GIT_PASSWORD
      valueFrom:
        secretKeyRef:
          key: password
          name: gitlab-auth
    - name: GITOPS_URL
      valueFrom:
        secretKeyRef:
          key: gitops-url
          name: gitlab-auth
    - name: IMAGE_TAG
      value: $(params.image-tag)
    - name: KUSTOMIZE_PATH
      value: $(params.kustomize-path)
    - name: GITOPS_SUBDIR
      value: $(params.gitops-subdir)
    - name: COMMIT_MSG
      value: 'ci(open-webui): promote image tag $(params.image-tag)'
    image: alpine/git:v2.45.2
    name: patch-and-commit
    script: "#!/bin/sh\nset -eu\n\ncd \"$(workspaces.source.path)\"\nDIR=\"${GITOPS_SUBDIR}\"\
      \n\n# Build the authenticated URL up-front; GITOPS_URL itself stays credential-free.\n\
      NO_SCHEME=\"${GITOPS_URL#*://}\"\nHOST_PART=\"${NO_SCHEME%%/*}\"\nPATH_PART=\"\
      ${NO_SCHEME#*/}\"\nAUTH_URL=\"http://${GIT_USERNAME}:${GIT_PASSWORD}@${HOST_PART}/${PATH_PART}\"\
      \n\nif [ ! -d \"$DIR\" ]; then\n  git clone \"$AUTH_URL\" \"$DIR\"\nelse\n \
      \ cd \"$DIR\"\n  git remote set-url origin \"$AUTH_URL\"\n  git pull --ff-only\
      \ origin main\nfi\n\ncd \"$DIR\"\ngit config user.name  \"openwebui-cicd-bot\"\
      \ngit config user.email \"openwebui-cicd-bot@users.noreply.local\"\n\n# Rewrite\
      \ the newTag under the `images:` block of the prod overlay.\nsed -i \"s#^\\\
      ( *newTag:\\).*#\\1 ${IMAGE_TAG}#\" \"$KUSTOMIZE_PATH\"\n\nif git diff --quiet\
      \ -- \"$KUSTOMIZE_PATH\"; then\n  echo \"No change needed: tag already ${IMAGE_TAG}\"\
      \n  exit 0\nfi\n\necho \"--- diff ---\"\ngit --no-pager diff -- \"$KUSTOMIZE_PATH\"\
      \n\ngit add \"$KUSTOMIZE_PATH\"\ngit commit -m \"$COMMIT_MSG\"\ngit push origin\
      \ HEAD:main\n\necho \"GitOps repo updated to tag ${IMAGE_TAG}; Argo CD will\
      \ auto-sync.\"\n"
    workingDir: $(workspaces.source.path)
  workspaces:
  - name: source
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  labels:
    app.kubernetes.io/part-of: china-study-free-cicd
  name: china-study-free-listener
  namespace: cicd
spec:
  namespaceSelector: {}
  resources: {}
  serviceAccountName: pipeline
  triggers:
  - bindings:
    - kind: TriggerBinding
      ref: china-study-free-binding
    interceptors:
    - params:
      - name: secretRef
        value:
          secretKey: secretToken
          secretName: china-study-free-webhook-secret
      - name: eventTypes
        value:
        - Push Hook
      ref:
        kind: ClusterInterceptor
        name: gitlab
    - params:
      - name: filter
        value: body.object_kind == 'push' && body.ref == 'refs/heads/main'
      ref:
        kind: ClusterInterceptor
        name: cel
    name: gitlab-push
    template:
      ref: china-study-free-template

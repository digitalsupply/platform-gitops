    kind: PipelineRun
    metadata:
      generateName: compassio-triggered-
      labels:
        app.kubernetes.io/part-of: compassio-cicd
        compassio.cicd/commit: $(tt.params.gitrevision)
      namespace: cicd
    spec:
      params:
      - name: git-url
        value: $(tt.params.gitrepositoryurl)
      - name: git-revision
        value: $(tt.params.gitrevision)
      - name: git-before
        value: $(tt.params.gitbefore)
      - name: image-tag
        value: $(tt.params.gitrevision)
      pipelineRef:
        name: compassio-cicd
      taskRunTemplate:
        podTemplate:
          imagePullSecrets:
          - name: harbor-auth
          nodeSelector:
            kubernetes.io/hostname: worker03
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
        serviceAccountName: pipeline
      workspaces:
      - name: shared-workspace
        volumeClaimTemplate:
          spec:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 256Mi
            storageClassName: nfs-sc

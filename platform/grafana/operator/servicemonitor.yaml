# Grafana Operator 自身指标。
# Prometheus CR 的 serviceMonitorSelector 为 release=prometheus，且 namespaceSelector 为空（全集群）。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: grafana-operator
  namespace: grafana-operator
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-operator
      app.kubernetes.io/component: operator
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s

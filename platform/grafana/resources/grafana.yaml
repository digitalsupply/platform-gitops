# external 模式：接管现有 Helm 部署的 Grafana，不替换 Deployment/PVC
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: prometheus-grafana
  namespace: monitoring
  labels:
    dashboards: prometheus-grafana
  annotations:
    # 连接根资源，避免误删导致整个 Grafana 外部连接被移除
    argocd.argoproj.io/sync-options: Prune=false
spec:
  external:
    url: http://prometheus-grafana.monitoring.svc:80
    adminUser:
      name: prometheus-grafana-admin
      key: admin-user
    adminPassword:
      name: prometheus-grafana-admin
      key: admin-password

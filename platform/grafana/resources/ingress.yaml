# 采用集群里已有的 Grafana IngressRoute，纳入 GitOps 管理。
# .local 域名使用 Traefik 默认自签证书（tls: {}）。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`grafana.example.local`) || Host(`grafana.k8s.local`)
      services:
        - name: prometheus-grafana
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-http-redirect
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`grafana.example.local`) || Host(`grafana.k8s.local`)
      middlewares:
        - name: redirect-to-https
      services:
        - name: prometheus-grafana
          port: 80

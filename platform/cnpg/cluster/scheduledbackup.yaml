apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg16-ceph-daily-full
  namespace: cnpg-system
  labels:
    cnpg.io/cluster: pg16-ceph
spec:
  backupOwnerReference: self
  cluster:
    name: pg16-ceph
  immediate: true
  schedule: "0 0 2 * * *"
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

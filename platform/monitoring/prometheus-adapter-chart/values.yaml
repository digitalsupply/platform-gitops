affinity: {}
topologySpreadConstraints: []
nameOverride: ''
fullnameOverride: ''
image:
  repository: registry.k8s.io/prometheus-adapter/prometheus-adapter
  tag: ''
  pullPolicy: IfNotPresent
  pullSecrets: []
logLevel: 4
metricsRelistInterval: 1m
listenPort: 6443
nodeSelector: {}
priorityClassName: ''
namespaceOverride: ''
customAnnotations: {}
customLabels: {}
prometheus:
  url: http://prometheus.default.svc
  port: 9090
  path: ''
replicas: 1
podSecurityContext:
  fsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault
rbac:
  create: true
  useAuthReaderClusterRole: false
  externalMetrics:
    resources:
    - '*'
  customMetrics:
    resources:
    - '*'
automountServiceAccountToken: true
serviceAccount:
  create: true
  name: null
  annotations: {}
  automountServiceAccountToken: true
dnsConfig: {}
resources: {}
livenessProbe: &id001
  tcpSocket:
    port: https
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe: *id001
startupProbe: {}
rules:
  default: true
  custom: []
  existing: null
  external: []
service:
  annotations: {}
  port: 443
  type: ClusterIP
  ipDualStack:
    enabled: false
    ipFamilies:
    - IPv6
    - IPv4
    ipFamilyPolicy: PreferDualStack
tls:
  enable: false
  ca: '# Public CA file that signed the APIService'
  key: '# Private key of the APIService'
  certificate: '# Public key of the APIService'
env: []
extraArguments: []
extraContainers: []
extraVolumes: []
extraVolumeMounts: []
tolerations: []
podLabels: {}
podAnnotations: {}
deploymentAnnotations: {}
hostNetwork:
  enabled: false
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 25%
podDisruptionBudget:
  enabled: false
  minAvailable: null
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: null
certManager:
  enabled: false
  caCertDuration: 43800h0m0s
  certDuration: 8760h0m0s
  caCertRevisionHistoryLimit: null
  certRevisionHistoryLimit: null
extraManifests: []
revisionHistoryLimit: 10

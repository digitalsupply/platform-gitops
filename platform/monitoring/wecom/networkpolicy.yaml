apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wecom-adapter
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wecom-adapter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS: 必须显式指向 kube-dns 的 Pod，Cilium 下 ipBlock 0.0.0.0/0 不匹配 ClusterIP 后端
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # 企业微信群机器人
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
